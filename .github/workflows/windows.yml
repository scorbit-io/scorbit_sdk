name: Windows

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

# A Windows round costs ~15 minutes, so a push that supersedes an in-flight run
# should stop it rather than race it. Not applied to main: a push there should
# always produce a complete result.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

  # x64-windows-static-md, NOT x64-windows-static. cmake/tools.cmake sets
  # CMAKE_MSVC_RUNTIME_LIBRARY to the DYNAMIC CRT, and the -md triplet is static
  # libraries against that dynamic runtime. Plain -static mismatches and the
  # LNK2038 errors it produces read nothing like a triplet problem.
  VCPKG_TARGET_TRIPLET: x64-windows-static-md

  # Binary caching, without which every run pays vcpkg's full build cost --
  # roughly 17 minutes, against 35-45 seconds for the compile that follows it.
  # The `files` provider is used rather than `x-gha` so the cache is handled by
  # actions/cache like everything else here, instead of vcpkg talking to the
  # Actions cache service directly.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: create the vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_cache"

      # Compiled output depends on the toolchain, and windows-latest is mutable.
      # vcpkg hashes the compiler, CMake and PowerShell into every package ABI, so
      # an image bump makes every cached binary unusable. Keyed on vcpkg.json
      # alone, that cache still hit exactly, the save was skipped, and every run
      # since the 20260922 image (cl 19.51.36256 -> 36257) logged `Restored 0
      # package(s)` and rebuilt all 84 ports. Same fix as scorbitd 8c43d27.
      - name: resolve the toolchain for cache keys
        id: toolchain
        shell: pwsh
        run: |
          # Never fail the job over a cache key: each lookup falls back to
          # "unknown", which only makes the key less specific.
          $vs = "unknown"; $cl = "unknown"; $cmake = "unknown"
          try { $cmake = ((cmake --version | Select-Object -First 1) -replace '[^0-9.]','') } catch {}
          try {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vs = (& $vswhere -latest -property catalog_productSemanticVersion)
              $root = (& $vswhere -latest -property installationPath)
              $exe = Get-ChildItem "$root\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" |
                Sort-Object FullName | Select-Object -Last 1
              if ($exe) { $cl = $exe.VersionInfo.ProductVersion }
            }
          } catch {}
          $pwsh = "$($PSVersionTable.PSVersion)"
          $id = "msvc$vs-cl$cl-cmake$cmake-pwsh$pwsh"
          "id=$id" >> $env:GITHUB_OUTPUT
          Write-Host "toolchain key component: $id"

      # Restore and save are SPLIT deliberately. actions/cache saves in a post
      # step that is SKIPPED when the job fails, so a single actions/cache step
      # never writes the cache while the build is red -- which is precisely when
      # iteration is happening and the cache is worth most.
      #
      # Measured before this split: four consecutive failing runs, each paying
      # ~14 minutes to rebuild every port, with `Post cache vcpkg binaries ->
      # skipped` as the only evidence that nothing had been stored.
      #
      # Keyed on the toolchain and vcpkg.json (which carries builtin-baseline).
      # The fallback stays within one toolchain: binaries from another are
      # unusable, and restoring them only grows the next save.
      - name: restore vcpkg binaries
        id: vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ steps.toolchain.outputs.id }}-

      # CPM sources, split for the same reason. The build directories and the
      # cache itself are excluded from the hash: configure writes .cmake and
      # CMakeLists.txt files there, so a key computed after it would differ.
      - name: restore CPM sources
        id: cpm
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/cpm_modules
          key: cpm-windows-v2-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '!build/**', '!build-tests/**', '!cpm_modules/**') }}
          restore-keys: |
            cpm-windows-v2-

      # The configured build trees, so MSBuild skips dependencies it already
      # compiled -- the CPM cache holds sources only, so centrifugo-cpp, cpr and
      # friends recompiled every run. It relies on a timestamp asymmetry:
      # checkout gives our sources fresh mtimes, so they always rebuild, while
      # dependency sources come out of the restored tar with their original
      # mtimes and their objects still look up to date. scorbitd measured
      # ~26m -> ~8m with this (SB-4970).
      #
      # No restore-keys: a prefix match could restore a tree configured against
      # dependencies the current CMakeLists no longer declares, which builds the
      # wrong thing rather than a slow one. The build tree is exact-key only.
      - name: restore build trees
        id: tree
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/build
            ${{ github.workspace }}/build-tests
          key: buildtree-windows-${{ steps.toolchain.outputs.id }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'vcpkg.json', '!build/**', '!build-tests/**', '!cpm_modules/**') }}

      # No generator is specified, so this uses the Visual Studio generator,
      # which locates MSVC unaided. That is a deliberate deviation from the
      # recorded known-good invocation, which used -GNinja: Ninja with MSVC needs
      # a developer environment set up first, and the VS generator is what this
      # repo's Windows job has already been passing with. They differ in setup,
      # not in outcome. If this moves to Ninja, a vcvars step has to come with it.
      #
      # SCORBIT_SDK_PRODUCTION stays OFF: production requires
      # SCORBIT_SDK_ENCRYPT_SECRET in the environment (cmake/encrypt.cmake) and
      # fails configure without it. SCORBIT_SDK_ABI is set anyway, because it is
      # the established tag for this toolchain and CMakeLists.txt rejects
      # "unknown" the moment production is ever switched on.
      # vcpkg is checked out AT the pinned baseline rather than using the one
      # bundled with the runner image, because mixing the two does not work.
      #
      # The image's vcpkg sits at its own commit. Pointing its toolchain at a
      # different builtin-baseline makes vcpkg resolve the version database from
      # the pinned commit while the ports tree on disk is from another, and the
      # two disagree:
      #
      #   error: no version database entry for curl at 8.22.0#1
      #   error: no version database entry for liblzma at 5.8.4
      #
      # When the checkout IS the baseline, there is no cross-commit resolution to
      # get wrong -- ports, version database and baseline are one tree. That also
      # makes --depth=1 sufficient, since no historical trees are ever consulted.
      - name: check out vcpkg at the pinned baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if (-not $baseline) { throw "vcpkg.json has no builtin-baseline" }
          Write-Output "baseline: $baseline"

          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git init --quiet $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --quiet --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "could not fetch vcpkg at $baseline" }
          git -C $root checkout --quiet FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "could not check out vcpkg at $baseline" }

          $head = git -C $root rev-parse HEAD
          if ($head -ne $baseline) { throw "vcpkg checkout is at $head, expected $baseline" }

          & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }

          $toolchain = Join-Path $root "scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path $toolchain)) { throw "toolchain missing at $toolchain" }
          Write-Output "toolchain: $toolchain"
          "VCPKG_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV

      - name: configure the SDK
        id: configure_sdk
        shell: pwsh
        run: |
          cmake -S . -B build `
            "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_TOOLCHAIN }}" `
            "-DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }}" `
            -DSCORBIT_SDK_PRODUCTION=OFF `
            -DSCORBIT_SDK_ABI=msvc2022

      - name: build the SDK
        run: cmake --build build --config Release

      # VCPKG_MANIFEST_DIR is required here and easy to miss: in manifest mode
      # vcpkg looks for vcpkg.json beside the -S directory, so configuring the
      # tests project would look for tests/vcpkg.json and install nothing.
      - name: configure the tests
        id: configure_tests
        shell: pwsh
        run: |
          cmake -S tests -B build-tests `
            "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_TOOLCHAIN }}" `
            "-DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }}" `
            "-DVCPKG_MANIFEST_DIR=${{ github.workspace }}"

      - name: build the tests
        id: build_tests
        run: cmake --build build-tests --config Release

      # Run from the build root that actually registered the tests. `ctest` in a
      # directory with no registered tests reports "Total Tests: 0" and exits 0 --
      # a pass that ran nothing. --no-tests=error turns that into a failure.
      - name: test
        run: ctest --test-dir build-tests -C Release --no-tests=error --output-on-failure

      # Every save below runs on a red build too -- see the note on the vcpkg
      # restore -- but only once the stage it banks has completed, and each takes
      # its key from the restore step rather than recomputing it.

      # After the SDK configure, every port is installed, so the cache is
      # complete even if compiling fails later. Saving one from a configure that
      # died mid-install would bank a partial cache under the exact key, and an
      # exact hit is never re-saved. Skipped on an exact hit, since re-uploading
      # an unchanged cache is pure cost.
      - name: save vcpkg binaries
        if: always() && steps.configure_sdk.outcome == 'success' && steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}

      # After the tests configure, every CPM fetch has finished. A tree saved
      # from a configure that died mid-download poisons later runs: CPM finds the
      # directory, skips the fetch, and the package defines no target.
      - name: save CPM sources
        if: always() && steps.configure_tests.outcome == 'success' && steps.cpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/cpm_modules
          key: ${{ steps.cpm.outputs.cache-primary-key }}

      # Gated on the BUILD, not configure: a tree saved from a failed build holds
      # half-written objects, and restoring those is worse than recompiling. Our
      # own objects go stale as soon as the source changes, so the entry is only
      # written when the key is new -- a new toolchain or a CMake change.
      - name: save build trees
        if: always() && steps.build_tests.outcome == 'success' && steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/build
            ${{ github.workspace }}/build-tests
          key: ${{ steps.tree.outputs.cache-primary-key }}
